server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always
  forward-headers-strategy: framework

spring:
  application:
    name: pi-copilot
  datasource:
    url: jdbc:postgresql://localhost:5432/picopilot
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
          fetch_size: 100
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/picopilot}
          jwk-set-uri: ${OIDC_JWK_URI:http://localhost:8180/realms/picopilot/protocol/openid-connect/certs}

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true
    default-property-inclusion: non_null

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterAccess=600s

  # SMTP server for audit trail emails (picopilot.audit.email). Example for Gmail:
  # MAIL_HOST=smtp.gmail.com, MAIL_PORT=587, MAIL_USERNAME=you@gmail.com, MAIL_PASSWORD=<app password>
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:support.security.pi@gmail.com}
    password: ${MAIL_PASSWORD:Admin@123}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    # An unreachable SMTP server must not mark the application as down
    mail:
      enabled: false

picopilot:
  connectors:
    # Allow connectors to reach localhost/private networks. Keep true for local dev only;
    # the multi-tenant SaaS deployment must set CONNECTORS_ALLOW_PRIVATE_HOSTS=false.
    allow-private-hosts: ${CONNECTORS_ALLOW_PRIVATE_HOSTS:true}
  security:
    # AES-GCM key material for connector credentials (GitHub tokens, DB passwords)
    connector-secret-key: ${CONNECTOR_SECRET_KEY:local-dev-only-connector-key-change-me-0123456789}
    # Self-issued login (local admin + Google Sign-In) for running without Keycloak.
    # Set LOCAL_AUTH_ENABLED=false in production.
    local-auth:
      enabled: ${LOCAL_AUTH_ENABLED:true}
      admin-username: ${LOCAL_ADMIN_USERNAME:admin}
      admin-password: ${LOCAL_ADMIN_PASSWORD:admin@123}
      jwt-secret: ${LOCAL_AUTH_JWT_SECRET:local-dev-only-secret-change-me-0123456789}
      token-ttl-minutes: 480
      # OAuth 2.0 Web client ID from Google Cloud Console; empty hides the Google button
      google-client-id: ${GOOGLE_CLIENT_ID:}
      # Google accounts that get PLATFORM_ADMIN (comma-separated)
      admin-emails: ${LOCAL_ADMIN_EMAILS:}
    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:*}
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: Authorization,Content-Type,X-Request-ID,X-Correlation-ID,X-Workspace-Id
      max-age: 3600
  scan:
    worker:
      thread-pool-size: 4
      max-queue-size: 100
      batch-size: 500
      timeout-minutes: 60
  backfill:
    batch-size: 1000
    max-retries: 3
    retry-delay-ms: 5000
    worker-threads: 2
  ai:
    default-model: rules-only
    timeout-seconds: 30
    enabled: false
    # Claude resolves Final Review "Improve" comments. Empty key falls back to the SDK's default credentials.
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${PICOPILOT_AI_MODEL:claude-opus-5-5}
  review:
    # How often queued improvement rounds are picked up
    poll-interval-ms: ${PICOPILOT_REVIEW_POLL_MS:20000}
  encryption:
    default-mode: AEAD
    algorithm: AES/GCM/NoPadding
    key-size: 256
    envelope-enabled: true
    # Base64 AES-256 key used by the LOCAL_DEV encryption provider. Must match
    # PI_LOCAL_ENCRYPTION_KEY in the target application. Never use LOCAL_DEV in production.
    local-dev-key: ${PI_LOCAL_ENCRYPTION_KEY:qTBIwDHqob6znFvvalLRtC33wZH04wPeuI/nVdZnnOE=}
  github:
    app-id: ${GITHUB_APP_ID:}
    app-installation-id: ${GITHUB_INSTALLATION_ID:}
    private-key-ref: ${GITHUB_PRIVATE_KEY_REF:}
    api-base-url: https://api.github.com
  audit:
    retention-days: 2555
    # Emails for audit trail events, sent through spring.mail after the event is saved
    email:
      enabled: ${AUDIT_EMAIL_ENABLED:true}
      from: ${AUDIT_EMAIL_FROM:${MAIL_USERNAME:pi-copilot@localhost}}
      # Comma-separated recipients
      to: ${AUDIT_EMAIL_TO:vishaltyagi11187@gmail.com}
      # Comma-separated actions to email (e.g. SCAN_APPROVED,FINAL_REVIEW_APPROVE), or * for every action
      actions: ${AUDIT_EMAIL_ACTIONS:*}
      # Lowest severity that is emailed: INFO, LOW, MEDIUM, HIGH or CRITICAL
      min-severity: ${AUDIT_EMAIL_MIN_SEVERITY:INFO}
      subject-prefix: "[PI Security Co-Pilot]"
  feature-flags:
    default-rollback-window-hours: 72

logging:
  level:
    root: INFO
    com.picopilot: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
  structured:
    format:
      console: logstash