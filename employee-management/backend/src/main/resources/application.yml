server:
  port: 8080
spring:
  application:
    name: employee-management
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/employee_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
pi:
  encryption:
    # Base64 AES-256 key shared with PI Co-Pilot's LOCAL_DEV provider (development only)
    local-key: ${PI_LOCAL_ENCRYPTION_KEY:qTBIwDHqob6znFvvalLRtC33wZH04wPeuI/nVdZnnOE=}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
