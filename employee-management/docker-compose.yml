services:
  postgres:
    image: postgres:16
    container_name: employee-postgres
    environment:
      POSTGRES_DB: employeedb
      POSTGRES_USER: employee_app
      POSTGRES_PASSWORD: employee_dev_password
    ports:
      - "5432:5432"
    volumes:
      - employee_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U employee_app -d employeedb"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  employee_pgdata:
